[project]
name = "nids"
version = "2.0.0.dev0"
description = "AI-NIDS v2: flow-based network intrusion detection with honest ML evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "typer>=0.15",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# Packet capture. NFStream is the Linux backend; Scapy is the cross-platform fallback.
capture = [
    "scapy>=2.6",
    "nfstream>=6.5; sys_platform == 'linux'",
]
# Offline training and evaluation.
ml = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
]

[project.scripts]
nids = "nids.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "scapy>=2.6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nids"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# tests run fixed commands (S603) and use fixture passwords/paths (S105, S106, S108)
"tests/**" = ["S603", "S105", "S106", "S108"]
"src/nids/store/migrations/versions/*" = ["E501"]  # generated by Alembic

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["nids"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["nids.core.*", "nids.sensor.flows", "nids.sensor.packets"]
strict = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nids.ml.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scapy.*", "nfstream.*", "sklearn.*", "lightgbm.*", "joblib.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pandas internals on NumPy 2; not our code, and it would drown out real warnings
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
