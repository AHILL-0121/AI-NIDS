<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIDS - Network Intrusion Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-brand {
            font-weight: bold;
            color: #dc3545 !important;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            font-weight: bold;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-running {
            background-color: #28a745;
            animation: pulse 2s infinite;
        }
        .status-stopped {
            background-color: #dc3545;
        }
        .status-error {
            background-color: #ffc107;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .metric-card {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .metric-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .alert-item {
            border-left: 4px solid #dc3545;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #fff;
            border-radius: 5px;
        }
        .alert-normal {
            border-left-color: #28a745;
        }
        .alert-warning {
            border-left-color: #ffc107;
        }
        .btn-custom {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-start {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            color: white;
        }
        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #fd7e14 100%);
            border: none;
            color: white;
        }
        .nav-tabs .nav-link {
            border-radius: 10px 10px 0 0;
            border: none;
            color: #6c757d;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .log-error {
            color: #dc3545;
        }
        .log-warning {
            color: #ffc107;
        }
        .log-info {
            color: #17a2b8;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-shield-alt"></i> NIDS Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">
                    <span id="status-indicator" class="status-indicator status-stopped"></span>
                    <span id="status-text">Stopped</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Control Panel -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-cogs"></i> Control Panel <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="Use these controls to start/stop monitoring, train the model, or clear alerts."></i>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <button id="start-btn" class="btn btn-start btn-custom w-100" data-bs-toggle="tooltip" title="Begin real-time network monitoring and intrusion detection.">
                                    <i class="fas fa-play"></i> START NIDS
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button id="stop-btn" class="btn btn-stop btn-custom w-100" disabled data-bs-toggle="tooltip" title="Stop monitoring and generate a session report.">
                                    <i class="fas fa-stop"></i> STOP NIDS
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button id="train-btn" class="btn btn-primary btn-custom w-100" data-bs-toggle="tooltip" title="Train the machine learning model using synthetic or real network data.">
                                    <i class="fas fa-brain"></i> TRAIN MODEL
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button id="clear-alerts-btn" class="btn btn-warning btn-custom w-100" data-bs-toggle="tooltip" title="Remove all alerts from the dashboard.">
                                    <i class="fas fa-trash"></i> CLEAR ALERTS
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Metrics Dashboard -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="metric-card" data-bs-toggle="tooltip" title="Total number of network packets analyzed by the NIDS during this session.">
                    <div class="metric-value" id="packets-processed">0</div>
                    <div class="metric-label">Packets Processed <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="Total number of network packets analyzed by the NIDS during this session."></i></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card" data-bs-toggle="tooltip" title="Number of network events flagged as suspicious or abnormal by the NIDS.">
                    <div class="metric-value" id="anomalies-detected">0</div>
                    <div class="metric-label">Anomalies Detected <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="Number of network events flagged as suspicious or abnormal by the NIDS."></i></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card" data-bs-toggle="tooltip" title="Current rate at which packets are being processed.">
                    <div class="metric-value" id="packet-rate">0</div>
                    <div class="metric-label">Packets/sec <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="Current rate at which packets are being processed."></i></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card" data-bs-toggle="tooltip" title="How long the NIDS has been running since last started.">
                    <div class="metric-value" id="uptime">0s</div>
                    <div class="metric-label">Uptime <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="How long the NIDS has been running since last started."></i></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <div class="col-12">
                <ul class="nav nav-tabs" id="mainTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" data-bs-target="#overview" type="button" role="tab" aria-controls="overview" aria-selected="true" title="Summary of system status, metrics, and traffic analysis.">
                            <i class="fas fa-chart-bar"></i> Overview
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="alerts-tab" data-bs-toggle="tab" data-bs-target="#alerts" type="button" role="tab" aria-controls="alerts" aria-selected="false" title="View recent security alerts and their explanations.">
                            <i class="fas fa-exclamation-triangle"></i> Alerts
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs" type="button" role="tab" aria-controls="logs" aria-selected="false" title="View system logs and events.">
                            <i class="fas fa-file-alt"></i> Logs
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" type="button" role="tab" aria-controls="config" aria-selected="false" title="Adjust system settings and parameters.">
                            <i class="fas fa-cog"></i> Configuration
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="mainTabsContent">
                    <!-- Overview Tab -->
                    <div class="tab-pane fade show active" id="overview" role="tabpanel">
                        <div class="row mt-3">
                            <div class="col-md-8">
                                <div class="card">
                                    <div class="card-header">
                                        <i class="fas fa-chart-line"></i> Traffic Analysis <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="Graph showing the number of packets processed over time."></i>
                                    </div>
                                    <div class="card-body">
                                        <div id="traffic-chart" style="height: 400px;"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card">
                                    <div class="card-header">
                                        <i class="fas fa-chart-pie"></i> Protocol Distribution <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="Pie chart showing the proportion of different network protocols detected."></i>
                                    </div>
                                    <div class="card-body">
                                        <div id="protocol-chart" style="height: 300px;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Alerts Tab -->
                    <div class="tab-pane fade" id="alerts" role="tabpanel">
                        <div class="row mt-3">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <i class="fas fa-exclamation-triangle"></i> Recent Alerts
                                        <span class="badge bg-danger ms-2" id="alert-count">0</span>
                                    </div>
                                    <div class="card-body">
                                        <div id="alerts-container">
                                            <p class="text-muted">No alerts to display</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Logs Tab -->
                    <div class="tab-pane fade" id="logs" role="tabpanel">
                        <div class="row mt-3">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <i class="fas fa-file-alt"></i> System Logs
                                    </div>
                                    <div class="card-body">
                                        <div id="logs-container" style="max-height: 500px; overflow-y: auto;">
                                            <p class="text-muted">Loading logs...</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Configuration Tab -->
                    <div class="tab-pane fade" id="config" role="tabpanel">
                        <div class="row mt-3">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <i class="fas fa-cog"></i> System Configuration
                                    </div>
                                    <div class="card-body">
                                        <form id="config-form">
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="network-interface" class="form-label">Network Interface <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="The network adapter to monitor (e.g., Ethernet, Wi-Fi)."></i></label>
                                                        <input type="text" class="form-control" id="network-interface" value="Ethernet">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="anomaly-threshold" class="form-label">Anomaly Threshold <i class="fas fa-info-circle" data-bs-toggle="tooltip" title="Sensitivity of the anomaly detection model. Lower values may increase false positives."></i></label>
                                                        <input type="number" class="form-control" id="anomaly-threshold" value="0.7" step="0.1" min="0" max="1">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="feature-window-size" class="form-label">Feature Window Size</label>
                                                        <input type="number" class="form-control" id="feature-window-size" value="100" min="10" max="1000">
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="model-type" class="form-label">Model Type</label>
                                                        <select class="form-select" id="model-type">
                                                            <option value="ensemble">Ensemble</option>
                                                            <option value="isolation_forest">Isolation Forest</option>
                                                            <option value="one_class_svm">One-Class SVM</option>
                                                            <option value="local_outlier_factor">Local Outlier Factor</option>
                                                        </select>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="alert-cooldown" class="form-label">Alert Cooldown (seconds)</label>
                                                        <input type="number" class="form-control" id="alert-cooldown" value="60" min="1" max="3600">
                                                    </div>
                                                    <div class="mb-3">
                                                        <label for="web-port" class="form-label">Web Port</label>
                                                        <input type="number" class="form-control" id="web-port" value="5000" min="1024" max="65535">
                                                    </div>
                                                </div>
                                            </div>
                                            <button type="submit" class="btn btn-primary">
                                                <i class="fas fa-save"></i> Save Configuration
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Training Modal -->
    <div class="modal fade" id="trainingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Train ML Model</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="training-form">
                        <div class="mb-3">
                            <label for="training-type" class="form-label">Training Type</label>
                            <select class="form-select" id="training-type">
                                <option value="synthetic">Synthetic Data</option>
                                <option value="pcap">PCAP File</option>
                            </select>
                        </div>
                        <div class="mb-3" id="synthetic-options">
                            <label for="n-samples" class="form-label">Number of Samples</label>
                            <input type="number" class="form-control" id="n-samples" value="1000" min="100" max="10000">
                        </div>
                        <div class="mb-3" id="synthetic-options">
                            <label for="anomaly-ratio" class="form-label">Anomaly Ratio</label>
                            <input type="number" class="form-control" id="anomaly-ratio" value="0.1" step="0.01" min="0" max="1">
                        </div>
                        <div class="mb-3" id="pcap-options" style="display: none;">
                            <label for="pcap-file" class="form-label">PCAP File Path</label>
                            <input type="text" class="form-control" id="pcap-file" placeholder="/path/to/file.pcap">
                        </div>
                        <div class="mb-3" id="pcap-options" style="display: none;">
                            <label for="max-packets" class="form-label">Max Packets</label>
                            <input type="number" class="form-control" id="max-packets" value="10000" min="1000" max="100000">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="start-training-btn">
                        <i class="fas fa-play"></i> Start Training
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/dashboard.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.forEach(function (tooltipTriggerEl) {
            new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
    </script>
</body>
</html>
