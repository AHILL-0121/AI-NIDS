name: docker

# Builds and smoke-tests the image on every change. On a version tag (v2.0.0, ...) it also
# publishes it to GitHub Container Registry as ghcr.io/<owner>/ai-nids:<version> and :latest.
on:
  push:
    branches: [main, v2]
    tags: ["v*"]
    paths: ["backend/**", "frontend/**", "docker/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # only used on tags
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          build-contexts: frontend=frontend
          load: true
          tags: ai-nids:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health, UI page, capture binary)
        run: |
          docker run -d --name nids -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true ai-nids:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/readyz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/ | grep -q "<html"
          docker run --rm --entrypoint getcap ai-nids:ci /app/.venv/bin/python-capture \
            | grep -q cap_net_raw
          docker logs nids
          docker rm -f nids

      - name: Tags for the registry
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-nids
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          build-contexts: frontend=frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
